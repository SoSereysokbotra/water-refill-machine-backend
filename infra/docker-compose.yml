services:
  postgres:
    image: postgres:16-alpine
    container_name: wrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wrm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wrm_dev}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wrm -d wrm_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wrm-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wrm-mosquitto
    restart: unless-stopped
    ports:
      - '${MQTT_PORT:-1883}:1883'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.txt:/mosquitto/config/acl.txt:ro
      - mosquitto_data:/mosquitto/data
    entrypoint: >
      sh -c "
        touch /mosquitto/config/password.txt &&
        mosquitto_passwd -b /mosquitto/config/password.txt wrm-backend password123 &&
        mosquitto_passwd -b /mosquitto/config/password.txt wrm-esp32-001 password123 &&
        /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      "
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 1883 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:

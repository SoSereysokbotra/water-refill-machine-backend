# Phase 3.5 early pilot: everything on ONE server (Oracle Cloud Always Free, Ampere ARM VM).
#   cd /opt/wrm/water-refill-machine/infra/pilot && docker compose -f docker-compose.pilot.yml up -d --build
# Only Caddy (80/443) is reachable from the internet. PostgreSQL and Redis stay on the internal network.

name: wrm-pilot

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: wrm-api:pilot
    restart: unless-stopped
    env_file: .env
    environment:
      # fixed for this layout (do not override in .env)
      DATABASE_URL: postgresql://wrm:${POSTGRES_PASSWORD}@postgres:5432/wrm?connection_limit=5
      DIRECT_DATABASE_URL: postgresql://wrm:${POSTGRES_PASSWORD}@postgres:5432/wrm
      REDIS_URL: redis://redis:6379
      MQTT_CA_FILE: /repo/certs/emqxsl-ca.crt
      PORT: '3000'
      RUN_MODE: all
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrm
      POSTGRES_DB: wrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wrm -d wrm']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  internal:

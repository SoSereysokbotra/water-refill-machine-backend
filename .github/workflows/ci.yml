name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wrm/api db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Dependency Cruiser (Architecture Boundaries)
        run: pnpm run depcruise

      - name: Unit Tests (no infrastructure)
        run: pnpm run test:unit

      # Integration / E2E tests need PostgreSQL, Redis and Mosquitto (same as local development)
      - name: Start local infrastructure
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Prepare test environment
        run: cp apps/api/.env.example apps/api/.env

      - name: Apply database migrations
        run: pnpm --filter @wrm/api db:deploy

      - name: Seed test machines
        run: pnpm --filter @wrm/api db:seed

      - name: Integration & E2E Tests
        run: pnpm --filter @wrm/api test:integration

      - name: Build
        run: pnpm run build

      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

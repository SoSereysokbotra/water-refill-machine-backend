global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'rules/alerts.yml'

scrape_configs:
  - job_name: 'wrm_api'
    metrics_path: '/metrics'
    # /metrics needs METRICS_TOKEN outside APP_ENV=local (put the same value in this file, not in git)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['api:3000']
        labels:
          environment: 'production'
          service: 'wrm-backend'

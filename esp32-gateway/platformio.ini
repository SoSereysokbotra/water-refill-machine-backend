; ESP32 gateway: Wi-Fi + MQTT (EMQX Cloud) <-> UART <-> STM32
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; send_on_enter: what you type is sent as one line when you press Enter
monitor_filters = direct, send_on_enter
monitor_echo = yes
monitor_eol = LF
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
